name: Secure RDP with Ollama Server
run-name: RDP Session - ${{ github.actor }} - ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model to download'
        required: false
        default: 'hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M'
        type: string

      session_timeout_minutes:
        description: 'Session timeout in minutes (5-360)'
        required: false
        default: '360'
        type: string

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 370

    env:
      RDP_USERNAME: 'RDP'

      RDP_FIREWALL_RULE_RDP: 'RDP-Tailscale'
      RDP_FIREWALL_RULE_OLLAMA: 'Ollama-API'

      TAILSCALE_SERVICE: 'Tailscale'
      OLLAMA_SERVICE: 'ollama'

      # Ollama network configuration
      OLLAMA_HOST: '0.0.0.0:11434'
      OLLAMA_PORT: '11434'

      # ============================================================
      # OLLAMA CONTEXT CONFIGURATION
      # ============================================================

      # 64K context
      OLLAMA_CONTEXT_LENGTH: '65536'

      # Flash Attention reduces memory usage at large contexts
      OLLAMA_FLASH_ATTENTION: '1'

      # Q8 KV cache uses substantially less memory than FP16
      # while retaining high quality.
      OLLAMA_KV_CACHE_TYPE: 'q8_0'

      # Keep model loaded during the session
      OLLAMA_KEEP_ALIVE: '-1'

      # Only one generation at a time.
      # This prevents multiple 64K KV caches consuming RAM/VRAM.
      OLLAMA_NUM_PARALLEL: '1'

      # Queue additional requests instead of immediately failing.
      OLLAMA_MAX_QUEUE: '512'

      # ============================================================
      # LONG CONTEXT GENERATION SETTINGS
      # ============================================================
      
      # Maximum tokens to predict (-1 = unlimited, use context as limit)
      OLLAMA_NUM_PREDICT: '-1'
      
      # Server-side request timeout in seconds (0 = no timeout)
      OLLAMA_REQUEST_TIMEOUT: '0'
      
      # Maximum tokens in a single response (0 = no limit)
      OLLAMA_MAX_TOKENS: '0'

      RDP_PORT: '3389'
      REMOTE_DESKTOP_SERVICE: 'TermService'

    steps:

      # ============================================================
      # VALIDATE INPUT
      # ============================================================

      - name: Validate Input Parameters
        shell: pwsh
        run: |
          $timeout = [int]"${{ github.event.inputs.session_timeout_minutes }}"

          if ($timeout -lt 5 -or $timeout -gt 360) {
              Write-Error "Session timeout must be between 5-360 minutes. Got: $timeout"
              exit 1
          }

          $model = "${{ github.event.inputs.model }}"

          if ([string]::IsNullOrWhiteSpace($model)) {
              $model = "hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M"
          }

          Write-Host "============================================="
          Write-Host " PARAMETERS"
          Write-Host "============================================="
          Write-Host "Model:              $model"
          Write-Host "Session timeout:    $timeout minutes"
          Write-Host "Context length:     $env:OLLAMA_CONTEXT_LENGTH tokens"
          Write-Host "Flash Attention:    $env:OLLAMA_FLASH_ATTENTION"
          Write-Host "KV Cache:           $env:OLLAMA_KV_CACHE_TYPE"
          Write-Host "Parallel requests:  $env:OLLAMA_NUM_PARALLEL"
          Write-Host "Keep alive:         $env:OLLAMA_KEEP_ALIVE"
          Write-Host "Num Predict:        $env:OLLAMA_NUM_PREDICT"
          Write-Host "Request Timeout:    $env:OLLAMA_REQUEST_TIMEOUT"
          Write-Host "Max Tokens:         $env:OLLAMA_MAX_TOKENS"
          Write-Host "============================================="

      # ============================================================
      # CONFIGURE RDP
      # ============================================================

      - name: Configure RDP Settings
        shell: pwsh
        run: |
          try {
              # Enable RDP
              Set-ItemProperty `
                -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                -Name 'fDenyTSConnections' `
                -Value 0 `
                -Force `
                -ErrorAction Stop

              Write-Host "✓ RDP enabled"

              # Disable Network Level Authentication
              Set-ItemProperty `
                -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                -Name 'UserAuthentication' `
                -Value 0 `
                -Force `
                -ErrorAction Stop

              Write-Host "✓ Network Level Authentication disabled"

              # RDP security layer
              Set-ItemProperty `
                -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                -Name 'SecurityLayer' `
                -Value 0 `
                -Force `
                -ErrorAction Stop

              Write-Host "✓ Security layer configured"

              Restart-Service `
                -Name $env:REMOTE_DESKTOP_SERVICE `
                -Force `
                -ErrorAction Stop

              Start-Sleep -Seconds 3

              Write-Host "✓ Remote Desktop service restarted"

          } catch {
              Write-Error "Failed to configure RDP: $_"
              exit 1
          }

      # ============================================================
      # FIREWALL
      # ============================================================

      - name: Configure Firewall Rules
        shell: pwsh
        run: |
          try {

              netsh advfirewall firewall delete rule `
                name="$env:RDP_FIREWALL_RULE_RDP" `
                2>$null

              netsh advfirewall firewall delete rule `
                name="$env:RDP_FIREWALL_RULE_OLLAMA" `
                2>$null

              Write-Host "✓ Old firewall rules cleaned up"

              # RDP
              netsh advfirewall firewall add rule `
                name="$env:RDP_FIREWALL_RULE_RDP" `
                dir=in `
                action=allow `
                protocol=TCP `
                localport=$env:RDP_PORT `
                profile=any `
                2>&1 | Out-Null

              Write-Host "✓ RDP firewall rule added"

              # Ollama
              netsh advfirewall firewall add rule `
                name="$env:RDP_FIREWALL_RULE_OLLAMA" `
                dir=in `
                action=allow `
                protocol=TCP `
                localport=$env:OLLAMA_PORT `
                profile=any `
                2>&1 | Out-Null

              Write-Host "✓ Ollama firewall rule added"

          } catch {
              Write-Error "Failed to configure firewall: $_"
              exit 1
          }

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: pwsh
        run: |
          try {

              $upper = [char[]](65..90)
              $lower = [char[]](97..122)
              $numbers = [char[]](48..57)

              $special = @(
                  '!',
                  '@',
                  '#',
                  '$',
                  '%',
                  '^',
                  '&',
                  '*'
              )

              $passwordChars = @()

              $passwordChars += ($upper | Get-Random -Count 4)
              $passwordChars += ($lower | Get-Random -Count 4)
              $passwordChars += ($numbers | Get-Random -Count 4)
              $passwordChars += ($special | Get-Random -Count 4)

              $password = -join ($passwordChars | Get-Random -Count 16)

              $securePass = ConvertTo-SecureString `
                $password `
                -AsPlainText `
                -Force

              $existingUser = Get-LocalUser `
                -Name $env:RDP_USERNAME `
                -ErrorAction SilentlyContinue

              if ($existingUser) {

                  Set-LocalUser `
                    -Name $env:RDP_USERNAME `
                    -Password $securePass `
                    -ErrorAction Stop

                  Write-Host "✓ RDP user password reset"

              } else {

                  New-LocalUser `
                    -Name $env:RDP_USERNAME `
                    -Password $securePass `
                    -AccountNeverExpires `
                    -ErrorAction Stop | Out-Null

                  Add-LocalGroupMember `
                    -Group 'Administrators' `
                    -Member $env:RDP_USERNAME `
                    -ErrorAction Stop

                  Add-LocalGroupMember `
                    -Group 'Remote Desktop Users' `
                    -Member $env:RDP_USERNAME `
                    -ErrorAction Stop

                  Write-Host "✓ RDP user created"

              }

              if (-not (Get-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -ErrorAction SilentlyContinue)) {

                  throw "User creation verification failed"
              }

              "RDP_USER=$env:RDP_USERNAME" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

              "RDP_PASS=$password" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

          } catch {
              Write-Error "Failed to create RDP user: $_"
              exit 1
          }

      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          try {

              $installerUrl =
                'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

              $installerPath =
                "$env:TEMP\tailscale-latest.msi"

              Write-Host "Downloading Tailscale..."

              $ProgressPreference = 'SilentlyContinue'

              Invoke-WebRequest `
                -Uri $installerUrl `
                -OutFile $installerPath `
                -ErrorAction Stop

              Write-Host "✓ Tailscale downloaded"

              Write-Host "Installing Tailscale..."

              $result = Start-Process `
                msiexec.exe `
                -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
                -Wait `
                -PassThru `
                -ErrorAction Stop

              if ($result.ExitCode -ne 0) {
                  throw "Tailscale installer exit code: $($result.ExitCode)"
              }

              Remove-Item `
                $installerPath `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5

              if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
                  throw "Tailscale executable not found"
              }

              Write-Host "✓ Tailscale installed successfully"

          } catch {
              Write-Error "Failed to install Tailscale: $_"
              exit 1
          }

      # ============================================================
      # INSTALL OLLAMA
      # ============================================================

      - name: Install Ollama
        shell: pwsh
        run: |
          try {

              Write-Host "Installing Ollama..."

              $ProgressPreference = 'SilentlyContinue'

              irm https://ollama.com/install.ps1 | iex

              Start-Sleep -Seconds 20

              Write-Host "✓ Ollama installation script completed"

              $possiblePaths = @(
                  "$env:ProgramFiles\Ollama\ollama.exe",
                  "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
                  "$env:USERPROFILE\AppData\Local\Programs\Ollama\ollama.exe"
              )

              $ollamaPath = $null

              foreach ($path in $possiblePaths) {

                  if (Test-Path `
                      -Path $path `
                      -ErrorAction SilentlyContinue) {

                      $ollamaPath = $path
                      break
                  }
              }

              if (-not $ollamaPath) {
                  throw "Ollama executable not found"
              }

              "OLLAMA_EXE=$ollamaPath" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

              Write-Host "✓ Ollama found at: $ollamaPath"

          } catch {
              Write-Error "Failed to install Ollama: $_"
              exit 1
          }

      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        shell: pwsh
        run: |
          try {

              $tailscaleExe =
                "$env:ProgramFiles\Tailscale\tailscale.exe"

              if (-not (Test-Path $tailscaleExe)) {
                  throw "Tailscale executable not found"
              }

              Write-Host "Connecting Tailscale..."

              & $tailscaleExe up `
                --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
                --hostname="gh-runner-${{ github.run_id }}" `
                --accept-dns=false

              if ($LASTEXITCODE -ne 0) {
                  throw "Tailscale connection failed"
              }

              $tailscaleIp = $null

              for ($i = 1; $i -le 24; $i++) {

                  Start-Sleep -Seconds 5

                  $tailscaleIp =
                    & $tailscaleExe ip -4 2>$null

                  if ($tailscaleIp) {
                      $tailscaleIp = $tailscaleIp.Trim()
                      break
                  }

                  Write-Host "Waiting for Tailscale IP... attempt $i/24"
              }

              if (-not $tailscaleIp) {
                  throw "Failed to obtain Tailscale IP"
              }

              "TAILSCALE_IP=$tailscaleIp" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

              Write-Host "✓ Tailscale connected"
              Write-Host "✓ Tailscale IP: $tailscaleIp"

          } catch {
              Write-Error "Failed to connect Tailscale: $_"
              exit 1
          }

      # ============================================================
      # START OLLAMA WITH 64K CONTEXT
      # ============================================================

      - name: Start Ollama Server
        shell: pwsh
        run: |
          try {

              if (-not (Test-Path $env:OLLAMA_EXE)) {
                  throw "Ollama executable not found at $env:OLLAMA_EXE"
              }

              Write-Host ""
              Write-Host "============================================="
              Write-Host " STARTING OLLAMA"
              Write-Host "============================================="
              Write-Host "Host:              $env:OLLAMA_HOST"
              Write-Host "Context:           $env:OLLAMA_CONTEXT_LENGTH"
              Write-Host "Flash Attention:   $env:OLLAMA_FLASH_ATTENTION"
              Write-Host "KV Cache:          $env:OLLAMA_KV_CACHE_TYPE"
              Write-Host "Parallel:          $env:OLLAMA_NUM_PARALLEL"
              Write-Host "Keep Alive:        $env:OLLAMA_KEEP_ALIVE"
              Write-Host "Num Predict:       $env:OLLAMA_NUM_PREDICT"
              Write-Host "Request Timeout:   $env:OLLAMA_REQUEST_TIMEOUT"
              Write-Host "Max Tokens:        $env:OLLAMA_MAX_TOKENS"
              Write-Host "============================================="

              # IMPORTANT:
              # Set environment variables on the process that
              # launches ollama serve.

              $ollamaEnv = @{
                  OLLAMA_HOST = $env:OLLAMA_HOST
                  OLLAMA_CONTEXT_LENGTH = $env:OLLAMA_CONTEXT_LENGTH
                  OLLAMA_FLASH_ATTENTION = $env:OLLAMA_FLASH_ATTENTION
                  OLLAMA_KV_CACHE_TYPE = $env:OLLAMA_KV_CACHE_TYPE
                  OLLAMA_KEEP_ALIVE = $env:OLLAMA_KEEP_ALIVE
                  OLLAMA_NUM_PARALLEL = $env:OLLAMA_NUM_PARALLEL
                  OLLAMA_MAX_QUEUE = $env:OLLAMA_MAX_QUEUE
                  OLLAMA_NUM_PREDICT = $env:OLLAMA_NUM_PREDICT
              }

              $psi = New-Object System.Diagnostics.ProcessStartInfo

              $psi.FileName = $env:OLLAMA_EXE
              $psi.Arguments = "serve"
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true

              foreach ($key in $ollamaEnv.Keys) {
                  $psi.EnvironmentVariables[$key] = $ollamaEnv[$key]
              }

              $process = New-Object System.Diagnostics.Process
              $process.StartInfo = $psi

              if (-not $process.Start()) {
                  throw "Failed to start Ollama"
              }

              Write-Host "✓ Ollama process started"
              Write-Host "✓ PID: $($process.Id)"

              Start-Sleep -Seconds 10

              # Check API
              $ready = $false

              for ($i = 1; $i -le 30; $i++) {

                  try {

                      $response = Invoke-WebRequest `
                        -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/tags" `
                        -UseBasicParsing `
                        -TimeoutSec 5 `
                        -ErrorAction Stop

                      if ($response.StatusCode -eq 200) {
                          $ready = $true
                          break
                      }

                  } catch {
                      Write-Host "Waiting for Ollama API... $i/30"
                  }

                  Start-Sleep -Seconds 2
              }

              if (-not $ready) {
                  throw "Ollama API did not become ready"
              }

              Write-Host "✓ Ollama API is ready"

              "OLLAMA_URL=http://$env:TAILSCALE_IP`:$env:OLLAMA_PORT" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

          } catch {
              Write-Error "Failed to start Ollama: $_"
              exit 1
          }

      # ============================================================
      # DOWNLOAD MODEL
      # ============================================================

      - name: Download Ollama Model
        shell: pwsh
        run: |
          try {

              if (-not (Test-Path $env:OLLAMA_EXE)) {
                  throw "Ollama executable path not set"
              }

              $model = '${{ github.event.inputs.model }}'

              if ([string]::IsNullOrWhiteSpace($model)) {
                  $model =
                    'hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M'
              }

              Write-Host ""
              Write-Host "============================================="
              Write-Host " DOWNLOADING MODEL"
              Write-Host "============================================="
              Write-Host "Model: $model"
              Write-Host "============================================="

              & $env:OLLAMA_EXE pull $model

              if ($LASTEXITCODE -ne 0) {
                  throw "Model pull failed with exit code: $LASTEXITCODE"
              }

              Write-Host ""
              Write-Host "✓ Model downloaded successfully"

              Write-Host ""
              Write-Host "Available models:"
              & $env:OLLAMA_EXE list

              "OLLAMA_MODEL=$model" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

          } catch {
              Write-Error "Failed to download model: $_"
              exit 1
          }

      # ============================================================
      # CREATE 64K MODEL CONFIGURATION
      # ============================================================

      - name: Configure Model For 64K Context
        shell: pwsh
        run: |
          try {

              $model = $env:OLLAMA_MODEL

              if ([string]::IsNullOrWhiteSpace($model)) {
                  throw "OLLAMA_MODEL is not set"
              }

              $customModel = "agent-64k"

              $modelfileLines = @()
              $modelfileLines += "FROM $model"
              $modelfileLines += ""
              $modelfileLines += "# Context and generation parameters"
              $modelfileLines += "PARAMETER num_ctx 65536"
              $modelfileLines += "PARAMETER num_predict -1"
              $modelfileLines += "PARAMETER temperature 0.7"
              $modelfileLines += "PARAMETER top_p 0.9"
              $modelfileLines += "PARAMETER top_k 40"
              $modelfileLines += "PARAMETER repeat_penalty 1.1"
              $modelfileLines += "PARAMETER repeat_last_n 64"
              $modelfileLines += "PARAMETER tfs_z 1.0"
              $modelfileLines += "PARAMETER mirostat 0"
              $modelfileLines += "PARAMETER mirostat_tau 5.0"
              $modelfileLines += "PARAMETER mirostat_eta 0.1"
              $modelfileLines += ""
              $modelfileLines += "# Stop tokens - ensure generation continues"
              $modelfileLines += 'PARAMETER stop "<|endoftext|>"'
              $modelfileLines += 'PARAMETER stop "<|im_end|>"'
              $modelfileLines += 'PARAMETER stop "<|end|>"'
              $modelfileLines += ""
              $modelfileLines += "# Performance settings"
              $modelfileLines += "PARAMETER num_gpu 999"
              $modelfileLines += "PARAMETER num_thread 8"
              $modelfileLines += "PARAMETER use_mmap 1"
              $modelfileLines += "PARAMETER use_mlock 1"

              $modelfile = $modelfileLines -join "`n"

              $modelfilePath =
                Join-Path $env:TEMP "Modelfile-64k"

              $modelfile |
                Out-File `
                  -FilePath $modelfilePath `
                  -Encoding UTF8 `
                  -Force

              Write-Host "Creating 64K context model with long generation support..."

              & $env:OLLAMA_EXE create `
                $customModel `
                -f $modelfilePath

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create 64K model"
              }

              Remove-Item `
                $modelfilePath `
                -Force `
                -ErrorAction SilentlyContinue

              "OLLAMA_ACTIVE_MODEL=$customModel" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding UTF8 `
                  -Append

              Write-Host "✓ Created model: $customModel"
              Write-Host "✓ Context: 65536"
              Write-Host "✓ Num Predict: -1 (unlimited)"
              Write-Host "✓ Stop tokens configured for continuous generation"

          } catch {
              Write-Error "Failed to configure 64K model: $_"
              exit 1
          }

      # ============================================================
      # VERIFY 64K CONFIGURATION
      # ============================================================

      - name: Verify Ollama 64K Context
        shell: pwsh
        run: |
          try {

              Write-Host ""
              Write-Host "============================================="
              Write-Host " VERIFYING OLLAMA CONFIGURATION"
              Write-Host "============================================="

              Write-Host "Environment context:"
              Write-Host "$env:OLLAMA_CONTEXT_LENGTH"

              Write-Host ""
              Write-Host "Model information:"

              $body = @{
                  model = $env:OLLAMA_ACTIVE_MODEL
              } | ConvertTo-Json

              $info = Invoke-RestMethod `
                -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/show" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body `
                -ErrorAction Stop

              Write-Host "Model parameters:"
              Write-Host ($info.parameters | Format-List | Out-String)

              Write-Host ""
              Write-Host "Running models before preload:"

              & $env:OLLAMA_EXE ps

              Write-Host ""
              Write-Host "✓ Ollama 64K configuration verified"

          } catch {
              Write-Error "Ollama verification failed: $_"
              exit 1
          }

      # ============================================================
      # PRELOAD MODEL
      # ============================================================

      - name: Preload 64K Model
        shell: pwsh
        run: |
          try {

              Write-Host "Preloading model into Ollama..."

              $body = @{
                  model = $env:OLLAMA_ACTIVE_MODEL
                  keep_alive = -1
              } | ConvertTo-Json

              Invoke-RestMethod `
                -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/generate" `
                -Method Post `
                -ContentType "application/json" `
                -Body $body `
                -ErrorAction Stop | Out-Null

              Start-Sleep -Seconds 5

              Write-Host ""
              Write-Host "Running model:"
              & $env:OLLAMA_EXE ps

              Write-Host ""
              Write-Host "✓ Model preloaded"

          } catch {
              Write-Error "Failed to preload model: $_"
              exit 1
          }

      # ============================================================
      # VERIFY RDP
      # ============================================================

      - name: Verify RDP Port
        shell: pwsh
        run: |
          try {

              Write-Host "Verifying RDP port..."

              $connection = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port $env:RDP_PORT `
                -WarningAction SilentlyContinue `
                -ErrorAction Stop

              if ($connection.TcpTestSucceeded) {
                  Write-Host "✓ RDP port is accessible"
              } else {
                  throw "RDP port connection failed"
              }

          } catch {
              Write-Error "RDP port verification failed: $_"
              exit 1
          }

      # ============================================================
      # VERIFY OLLAMA
      # ============================================================

      - name: Verify Ollama Port
        shell: pwsh
        run: |
          try {

              Write-Host "Verifying Ollama port..."

              $connection = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port $env:OLLAMA_PORT `
                -WarningAction SilentlyContinue `
                -ErrorAction Stop

              if ($connection.TcpTestSucceeded) {
                  Write-Host "✓ Ollama port is accessible"
              } else {
                  throw "Ollama port connection failed"
              }

          } catch {
              Write-Error "Ollama port verification failed: $_"
              exit 1
          }

      # ============================================================
      # CREATE API TEST SCRIPT
      # ============================================================

      - name: Create API Usage Examples
        shell: pwsh
        run: |
          $examplesPath = "$env:USERPROFILE\Desktop\ollama_api_examples.txt"
          
          $lines = @()
          $lines += "OLLAMA API USAGE EXAMPLES"
          $lines += "========================="
          $lines += ""
          $lines += "1. Basic Chat Completion (non-streaming, unlimited tokens):"
          $lines += '   curl http://localhost:11434/v1/chat/completions ^'
          $lines += '     -H "Content-Type: application/json" ^'
          $lines += "     -d '{"
          $lines += '       "model": "' + $env:OLLAMA_ACTIVE_MODEL + '",'
          $lines += '       "messages": ['
          $lines += '         {"role": "user", "content": "Write a comprehensive guide about..."}'
          $lines += '       ],'
          $lines += '       "stream": false,'
          $lines += '       "max_tokens": -1,'
          $lines += '       "temperature": 0.7'
          $lines += "     }'"
          $lines += ""
          $lines += "2. Native Ollama Generate API (RECOMMENDED for long contexts):"
          $lines += '   curl http://localhost:11434/api/generate ^'
          $lines += '     -H "Content-Type: application/json" ^'
          $lines += "     -d '{"
          $lines += '       "model": "' + $env:OLLAMA_ACTIVE_MODEL + '",'
          $lines += '       "prompt": "Write a detailed analysis of...",'
          $lines += '       "stream": false,'
          $lines += '       "options": {'
          $lines += '         "num_predict": -1,'
          $lines += '         "num_ctx": 65536,'
          $lines += '         "temperature": 0.7,'
          $lines += '         "top_p": 0.9'
          $lines += '       }'
          $lines += "     }'"
          $lines += ""
          $lines += "3. PowerShell Example with Unlimited Generation:"
          $lines += '   $body = @{'
          $lines += '       model = "' + $env:OLLAMA_ACTIVE_MODEL + '"'
          $lines += '       prompt = "Write a comprehensive guide..."'
          $lines += '       stream = $false'
          $lines += '       options = @{'
          $lines += '           num_predict = -1'
          $lines += '           num_ctx = 65536'
          $lines += '           temperature = 0.7'
          $lines += '       }'
          $lines += '   } | ConvertTo-Json -Depth 10'
          $lines += ""
          $lines += '   $response = Invoke-RestMethod `'
          $lines += '       -Uri "http://localhost:11434/api/generate" `'
          $lines += '       -Method Post `'
          $lines += '       -ContentType "application/json" `'
          $lines += '       -Body $body'
          $lines += ""
          $lines += '   Write-Host $response.response'
          $lines += ""
          $lines += "IMPORTANT NOTES:"
          $lines += "- Use num_predict: -1 for unlimited generation"
          $lines += "- The native /api/generate endpoint is recommended for long contexts"
          $lines += "- Model stays loaded with keep_alive: -1"
          $lines += "- Use the Tailscale IP for remote access: $env:TAILSCALE_IP"
          
          $content = $lines -join "`r`n"
          $content | Out-File -FilePath $examplesPath -Encoding UTF8
          
          Write-Host "✓ API usage examples saved to Desktop"
          Write-Host ""

      # ============================================================
      # DISPLAY CONNECTION INFORMATION
      # ============================================================

      - name: Display Session Information
        shell: pwsh
        run: |
          $timeout =
            [int]"${{ github.event.inputs.session_timeout_minutes }}"

          $endTime =
            (Get-Date).AddMinutes($timeout)

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════╗"
          Write-Host "║             RDP & OLLAMA SESSION                        ║"
          Write-Host "╠══════════════════════════════════════════════════════════╣"
          Write-Host "║ RDP Host:        $env:TAILSCALE_IP"
          Write-Host "║ RDP Port:        $env:RDP_PORT"
          Write-Host "║ RDP Username:    $env:RDP_USER"
          Write-Host "║ RDP Password:    $env:RDP_PASS"
          Write-Host "║"
          Write-Host "║ Ollama API:      $env:OLLAMA_URL"
          Write-Host "║ Ollama Model:    $env:OLLAMA_ACTIVE_MODEL"
          Write-Host "║ Context:         65536 tokens"
          Write-Host "║ Flash Attention: ENABLED"
          Write-Host "║ KV Cache:        Q8_0"
          Write-Host "║ Num Predict:     UNLIMITED (-1)"
          Write-Host "║ Generation:      LONG CONTEXT MODE"
          Write-Host "║"
          Write-Host "║ Session ends:    $endTime"
          Write-Host "╚══════════════════════════════════════════════════════════╝"
          Write-Host ""

          Write-Host "OpenAI-compatible Ollama endpoint:"
          Write-Host "$env:OLLAMA_URL/v1"
          Write-Host ""

          Write-Host "Ollama native endpoint (RECOMMENDED for long contexts):"
          Write-Host "$env:OLLAMA_URL/api"
          Write-Host ""

          Write-Host "API usage examples saved to Desktop:"
          Write-Host "ollama_api_examples.txt"
          Write-Host ""

          Write-Host "QUICK TEST (Native API - no streaming, unlimited tokens):"
          Write-Host ('curl http://localhost:11434/api/generate -H "Content-Type: application/json" -d "{\"model\":\"' + $env:OLLAMA_ACTIVE_MODEL + '\",\"prompt\":\"Hello\",\"stream\":false,\"options\":{\"num_predict\":-1}}"')
          Write-Host ""

          Write-Host "IMPORTANT:"
          Write-Host "• Use the Tailscale IP above rather than the public GitHub IP."
          Write-Host "• The Ollama API is exposed on the Tailscale-connected runner."
          Write-Host "• For long generations, use num_predict: -1 in options."
          Write-Host "• Use /api/generate endpoint for best long-context support."
          Write-Host ""

      # ============================================================
      # KEEP SESSION ALIVE
      # ============================================================

      - name: Keep Session Alive
        shell: pwsh
        run: |
          $timeout =
            [int]"${{ github.event.inputs.session_timeout_minutes }}"

          $endTime =
            (Get-Date).AddMinutes($timeout)

          Write-Host ""
          Write-Host "============================================="
          Write-Host " SESSION ACTIVE"
          Write-Host "============================================="
          Write-Host "End time: $endTime"
          Write-Host "Long context generation: ENABLED"
          Write-Host "Maximum generation limit: NONE (num_predict: -1)"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $remaining =
                $endTime - (Get-Date)

              Write-Host (
                "[{0}] Session active | Remaining: {1:hh\:mm\:ss}" -f `
                (Get-Date -Format "yyyy-MM-dd HH:mm:ss"),
                $remaining
              )

              # Check Ollama process
              $ollamaProcess =
                Get-Process `
                  -Name "ollama" `
                  -ErrorAction SilentlyContinue

              if (-not $ollamaProcess) {
                  Write-Host "WARNING: Ollama process is not running."
              } else {
                  $cpuPercent = 0
                  if ($ollamaProcess.CPU) {
                      $logicalProcessors = (Get-WmiObject Win32_ComputerSystem).NumberOfLogicalProcessors
                      if ($logicalProcessors -gt 0) {
                          $cpuPercent = [math]::Round($ollamaProcess.CPU / $logicalProcessors, 1)
                      }
                  }
                  $memoryMB = [math]::Round($ollamaProcess.WorkingSet64 / 1MB, 0)
                  Write-Host "Ollama CPU: ${cpuPercent}% | Memory: ${memoryMB} MB"
              }

              # Check Tailscale
              $tailscaleProcess =
                Get-Process `
                  -Name "tailscaled" `
                  -ErrorAction SilentlyContinue

              if (-not $tailscaleProcess) {
                  Write-Host "WARNING: Tailscale process not detected."
              }

              # Show model status periodically
              Write-Host "Active models:"
              & $env:OLLAMA_EXE ps 2>$null
              Write-Host ""

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Session timeout reached."

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host " CLEANUP"
          Write-Host "============================================="

          try {

              if ($env:OLLAMA_EXE -and
                  (Test-Path $env:OLLAMA_EXE)) {

                  Write-Host "Stopping Ollama..."

                  & $env:OLLAMA_EXE stop `
                    $env:OLLAMA_ACTIVE_MODEL `
                    2>$null
              }

          } catch {
              Write-Host "Ollama cleanup warning: $_"
          }

          try {

              $tailscaleExe =
                "$env:ProgramFiles\Tailscale\tailscale.exe"

              if (Test-Path $tailscaleExe) {

                  Write-Host "Disconnecting Tailscale..."

                  & $tailscaleExe down 2>$null
              }

          } catch {
              Write-Host "Tailscale cleanup warning: $_"
          }

          try {

              netsh advfirewall firewall delete rule `
                name="$env:RDP_FIREWALL_RULE_RDP" `
                2>$null

              netsh advfirewall firewall delete rule `
                name="$env:RDP_FIREWALL_RULE_OLLAMA" `
                2>$null

              Write-Host "✓ Firewall rules removed"

          } catch {
              Write-Host "Firewall cleanup warning: $_"
          }

          Write-Host "✓ Cleanup completed"
