name: Secure RDP with Ollama Server

run-name: RDP + Ollama - ${{ github.actor }} - ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to download"
        required: false
        default: "hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M"
        type: string

      session_timeout_minutes:
        description: "Session timeout in minutes (5-360)"
        required: false
        default: "360"
        type: string

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest

    # GitHub-hosted jobs have a maximum execution time of 6 hours.
    timeout-minutes: 360

    env:
      # ============================================================
      # BASIC CONFIGURATION
      # ============================================================

      RDP_USERNAME: "RDP"
      RDP_PORT: "3389"

      REMOTE_DESKTOP_SERVICE: "TermService"

      # ============================================================
      # FIREWALL RULE NAMES
      # ============================================================

      RDP_FIREWALL_RULE: "RDP-Tailscale-Only"
      OLLAMA_FIREWALL_RULE: "Ollama-Tailscale-Only"

      # Tailscale IPv4 CGNAT range.
      # Tailscale nodes normally receive addresses in 100.64.0.0/10.
      TAILSCALE_NETWORK: "100.64.0.0/10"

      # ============================================================
      # OLLAMA SERVER
      # ============================================================

      # Ollama must listen on the network interface so that
      # Tailscale clients can reach it.
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_PORT: "11434"

      # ============================================================
      # OLLAMA MEMORY / CONTEXT SETTINGS
      # ============================================================

      # 64K default context.
      OLLAMA_CONTEXT_LENGTH: "65536"

      # Reduce KV memory usage at large context sizes.
      OLLAMA_FLASH_ATTENTION: "1"

      # Q8 KV cache:
      # approximately half the memory of F16 KV cache.
      OLLAMA_KV_CACHE_TYPE: "q8_0"

      # Keep loaded during the session.
      OLLAMA_KEEP_ALIVE: "-1"

      # Only one generation at a time.
      # This is important on a 16 GB standard runner.
      OLLAMA_NUM_PARALLEL: "1"

      # Default Ollama queue size.
      OLLAMA_MAX_QUEUE: "512"

      # Don't keep multiple models resident unnecessarily.
      OLLAMA_MAX_LOADED_MODELS: "1"

      # Local-only mode.
      # Prevents Ollama cloud features from being used.
      OLLAMA_NO_CLOUD: "1"

    steps:

      # ============================================================
      # 1. VALIDATE INPUT
      # ============================================================

      - name: Validate Inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $timeout = [int]"${{ github.event.inputs.session_timeout_minutes }}"

          if ($timeout -lt 5 -or $timeout -gt 360) {
              throw "Session timeout must be between 5 and 360 minutes. Got: $timeout"
          }

          $model = "${{ github.event.inputs.model }}"

          if ([string]::IsNullOrWhiteSpace($model)) {
              $model = "hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M"
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VALIDATED CONFIGURATION"
          Write-Host "=============================================="
          Write-Host "Model:              $model"
          Write-Host "Session:            $timeout minutes"
          Write-Host "Ollama host:        $env:OLLAMA_HOST"
          Write-Host "Context:            $env:OLLAMA_CONTEXT_LENGTH"
          Write-Host "Flash Attention:    $env:OLLAMA_FLASH_ATTENTION"
          Write-Host "KV cache:           $env:OLLAMA_KV_CACHE_TYPE"
          Write-Host "Parallel requests:  $env:OLLAMA_NUM_PARALLEL"
          Write-Host "Max queue:          $env:OLLAMA_MAX_QUEUE"
          Write-Host "Max loaded models:  $env:OLLAMA_MAX_LOADED_MODELS"
          Write-Host "Cloud disabled:     $env:OLLAMA_NO_CLOUD"
          Write-Host "=============================================="

      # ============================================================
      # 2. SHOW RUNNER INFORMATION
      # ============================================================

      - name: Show Runner Information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RUNNER INFORMATION"
          Write-Host "=============================================="

          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "CPU cores: $([Environment]::ProcessorCount)"

          $ram = Get-CimInstance Win32_ComputerSystem
          $ramGB = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)

          Write-Host "RAM: $ramGB GB"

          Write-Host ""
          Write-Host "Disk:"
          Get-PSDrive C |
            Select-Object Name,
              @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}},
              @{Name="UsedGB";Expression={[math]::Round($_.Used/1GB,2)}}

      # ============================================================
      # 3. CONFIGURE RDP
      # ============================================================

      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING RDP"
          Write-Host "=============================================="

          # Enable Remote Desktop.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Use the normal Windows RDP security layer.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Ensure the TermService service is running.
          Set-Service `
            -Name $env:REMOTE_DESKTOP_SERVICE `
            -StartupType Automatic

          Restart-Service `
            -Name $env:REMOTE_DESKTOP_SERVICE `
            -Force

          Start-Sleep -Seconds 5

          $service = Get-Service -Name $env:REMOTE_DESKTOP_SERVICE

          if ($service.Status -ne "Running") {
              throw "Remote Desktop service failed to start."
          }

          Write-Host "RDP service: RUNNING"
          Write-Host "NLA: ENABLED"
          Write-Host "Security layer: DEFAULT"

      # ============================================================
      # 4. CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="

          # Generate a strong random password using the OS RNG.
          Add-Type -AssemblyName System.Security

          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijkmnopqrstuvwxyz".ToCharArray()
          $digits = "23456789".ToCharArray()
          $special = "!@#$%^&*_-+=".ToCharArray()

          $all = $upper + $lower + $digits + $special

          $bytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)

          $passwordChars = New-Object System.Collections.Generic.List[char]

          # Guarantee complexity requirements.
          $passwordChars.Add($upper[$bytes[0] % $upper.Length])
          $passwordChars.Add($lower[$bytes[1] % $lower.Length])
          $passwordChars.Add($digits[$bytes[2] % $digits.Length])
          $passwordChars.Add($special[$bytes[3] % $special.Length])

          for ($i = 4; $i -lt 20; $i++) {
              $passwordChars.Add($all[$bytes[$i] % $all.Length])
          }

          # Fisher-Yates shuffle.
          for ($i = $passwordChars.Count - 1; $i -gt 0; $i--) {
              $j = $bytes[$i % $bytes.Length] % ($i + 1)

              $tmp = $passwordChars[$i]
              $passwordChars[$i] = $passwordChars[$j]
              $passwordChars[$j] = $tmp
          }

          $password = -join $passwordChars

          # Mask password in GitHub Actions logs.
          Write-Output "::add-mask::$password"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword

              Enable-LocalUser `
                -Name $env:RDP_USERNAME

              Write-Host "Existing RDP user password updated."

          } else {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP user" |
                Out-Null

              Write-Host "RDP user created."
          }

          # Remove from Administrators if it was previously added.
          Remove-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users.
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Verify.
          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction Stop

          if (-not $user.Enabled) {
              Enable-LocalUser -Name $env:RDP_USERNAME
          }

          "RDP_PASSWORD=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "RDP user verified."

      # ============================================================
      # 5. CONFIGURE FIREWALL
      # ============================================================

      - name: Configure Tailscale-Only Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING FIREWALL"
          Write-Host "=============================================="

          # Remove old rules if they exist.
          Remove-NetFirewallRule `
            -DisplayName $env:RDP_FIREWALL_RULE `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName $env:OLLAMA_FIREWALL_RULE `
            -ErrorAction SilentlyContinue

          # RDP ONLY from Tailscale addresses.
          New-NetFirewallRule `
            -DisplayName $env:RDP_FIREWALL_RULE `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort $env:RDP_PORT `
            -RemoteAddress $env:TAILSCALE_NETWORK `
            -Profile Any `
            -Description "Allow RDP only from Tailscale"

          # Ollama ONLY from Tailscale addresses.
          New-NetFirewallRule `
            -DisplayName $env:OLLAMA_FIREWALL_RULE `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort $env:OLLAMA_PORT `
            -RemoteAddress $env:TAILSCALE_NETWORK `
            -Profile Any `
            -Description "Allow Ollama only from Tailscale"

          Write-Host "RDP allowed from:     $env:TAILSCALE_NETWORK"
          Write-Host "Ollama allowed from:  $env:TAILSCALE_NETWORK"

      # ============================================================
      # 6. INSTALL OLLAMA
      # ============================================================

      - name: Install Ollama
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " INSTALLING OLLAMA"
          Write-Host "=============================================="

          # Official Windows installation method.
          irm https://ollama.com/install.ps1 | iex

          Start-Sleep -Seconds 15

          $possiblePaths = @(
            "$env:ProgramFiles\Ollama\ollama.exe",
            "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
            "$env:USERPROFILE\AppData\Local\Programs\Ollama\ollama.exe"
          )

          $ollamaPath = $null

          foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                  $ollamaPath = $path
                  break
              }
          }

          if (-not $ollamaPath) {
              $ollamaPath = (
                Get-Command ollama.exe `
                  -ErrorAction SilentlyContinue
              ).Source
          }

          if (-not $ollamaPath) {
              throw "Ollama executable could not be located."
          }

          "OLLAMA_EXE=$ollamaPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Ollama executable:"
          Write-Host $ollamaPath

          & $ollamaPath --version

      # ============================================================
      # 7. CONNECT TAILSCALE
      # ============================================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # ============================================================
      # 8. GET TAILSCALE IP
      # ============================================================

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE"
          Write-Host "=============================================="

          $tailscale = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if (-not $tailscale) {
              throw "tailscale.exe was not found after Tailscale Action."
          }

          $tailscaleIp = $null

          for ($i = 1; $i -le 30; $i++) {

              $ips = & $tailscale.Source ip -4 2>$null

              foreach ($ip in $ips) {
                  $candidate = "$ip".Trim()

                  if ($candidate -match "^100\.\d+\.\d+\.\d+$") {
                      $tailscaleIp = $candidate
                      break
                  }
              }

              if ($tailscaleIp) {
                  break
              }

              Write-Host "Waiting for Tailscale IP... $i/30"
              Start-Sleep -Seconds 2
          }

          if (-not $tailscaleIp) {
              throw "Could not obtain a Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tailscaleIp" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "OLLAMA_URL=http://$tailscaleIp`:$env:OLLAMA_PORT" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Tailscale IPv4: $tailscaleIp"

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscale.Source status

      # ============================================================
      # 9. START OLLAMA SERVER
      # ============================================================

      - name: Start Ollama Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:OLLAMA_EXE)) {
              throw "Ollama executable not found: $env:OLLAMA_EXE"
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " STARTING OLLAMA SERVER"
          Write-Host "=============================================="

          Write-Host "Host:             $env:OLLAMA_HOST"
          Write-Host "Context:          $env:OLLAMA_CONTEXT_LENGTH"
          Write-Host "Flash Attention:  $env:OLLAMA_FLASH_ATTENTION"
          Write-Host "KV cache:         $env:OLLAMA_KV_CACHE_TYPE"
          Write-Host "Parallel:         $env:OLLAMA_NUM_PARALLEL"
          Write-Host "Queue:            $env:OLLAMA_MAX_QUEUE"
          Write-Host "Keep alive:       $env:OLLAMA_KEEP_ALIVE"
          Write-Host "Cloud disabled:   $env:OLLAMA_NO_CLOUD"

          # Stop any Ollama process that may have been started
          # automatically by the Windows installer.
          Get-Process -Name "ollama" `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          $psi = New-Object System.Diagnostics.ProcessStartInfo

          $psi.FileName = $env:OLLAMA_EXE
          $psi.Arguments = "serve"
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true

          $ollamaVariables = @{
            "OLLAMA_HOST" = $env:OLLAMA_HOST
            "OLLAMA_CONTEXT_LENGTH" = $env:OLLAMA_CONTEXT_LENGTH
            "OLLAMA_FLASH_ATTENTION" = $env:OLLAMA_FLASH_ATTENTION
            "OLLAMA_KV_CACHE_TYPE" = $env:OLLAMA_KV_CACHE_TYPE
            "OLLAMA_KEEP_ALIVE" = $env:OLLAMA_KEEP_ALIVE
            "OLLAMA_NUM_PARALLEL" = $env:OLLAMA_NUM_PARALLEL
            "OLLAMA_MAX_QUEUE" = $env:OLLAMA_MAX_QUEUE
            "OLLAMA_MAX_LOADED_MODELS" = $env:OLLAMA_MAX_LOADED_MODELS
            "OLLAMA_NO_CLOUD" = $env:OLLAMA_NO_CLOUD
          }

          foreach ($key in $ollamaVariables.Keys) {
              $psi.EnvironmentVariables[$key] =
                $ollamaVariables[$key]
          }

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi

          if (-not $process.Start()) {
              throw "Failed to start Ollama server."
          }

          "OLLAMA_PID=$($process.Id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Ollama PID: $($process.Id)"

          # Wait for API.
          $ready = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/tags" `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  if ($response.StatusCode -eq 200) {
                      $ready = $true
                      break
                  }

              } catch {
                  Write-Host "Waiting for Ollama... $i/60"
              }

              Start-Sleep -Seconds 2
          }

          if (-not $ready) {
              Write-Host ""
              Write-Host "Ollama stdout:"
              try {
                  $process.StandardOutput.ReadToEnd()
              } catch {}

              Write-Host ""
              Write-Host "Ollama stderr:"
              try {
                  $process.StandardError.ReadToEnd()
              } catch {}

              throw "Ollama API did not become ready."
          }

          Write-Host "Ollama API is ready."

      # ============================================================
      # 10. VERIFY NETWORK LISTENING
      # ============================================================

      - name: Verify Ollama Network Binding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING OLLAMA NETWORK"
          Write-Host "=============================================="

          $connections = Get-NetTCPConnection `
            -LocalPort $env:OLLAMA_PORT `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $connections) {
              throw "Ollama is not listening on port $env:OLLAMA_PORT."
          }

          $connections |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host "Local Ollama API test:"

          Invoke-RestMethod `
            -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/tags" `
            -Method Get

      # ============================================================
      # 11. DOWNLOAD MODEL
      # ============================================================

      - name: Download Ollama Model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $model = "${{ github.event.inputs.model }}"

          if ([string]::IsNullOrWhiteSpace($model)) {
              $model = "hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M"
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DOWNLOADING MODEL"
          Write-Host "=============================================="
          Write-Host "Model: $model"
          Write-Host "=============================================="

          & $env:OLLAMA_EXE pull $model

          if ($LASTEXITCODE -ne 0) {
              throw "ollama pull failed with exit code $LASTEXITCODE"
          }

          "OLLAMA_MODEL=$model" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Downloaded models:"
          & $env:OLLAMA_EXE list

      # ============================================================
      # 12. CREATE FIXED 64K MODEL
      # ============================================================

      - name: Create 64K Model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceModel = $env:OLLAMA_MODEL
          $customModel = "agent-64k"

          if ([string]::IsNullOrWhiteSpace($sourceModel)) {
              throw "OLLAMA_MODEL is empty."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING 64K MODEL"
          Write-Host "=============================================="

          $tempDir = Join-Path `
            $env:TEMP `
            "ollama-modelfile-$([guid]::NewGuid())"

          New-Item `
            -ItemType Directory `
            -Path $tempDir `
            -Force |
            Out-Null

          $modelfile = Join-Path $tempDir "Modelfile"

          @"
FROM $sourceModel

PARAMETER num_ctx 65536
PARAMETER num_predict -1
PARAMETER temperature 0.7
PARAMETER top_p 0.9
PARAMETER top_k 40
PARAMETER repeat_penalty 1.1
PARAMETER repeat_last_n 64
"@ |
            Set-Content `
              -Path $modelfile `
              -Encoding UTF8

          Write-Host "Modelfile:"
          Get-Content $modelfile

          Write-Host ""
          Write-Host "Creating: $customModel"

          & $env:OLLAMA_EXE create `
            $customModel `
            -f $modelfile

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create $customModel"
          }

          Remove-Item `
            $tempDir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          "OLLAMA_ACTIVE_MODEL=$customModel" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Created model: $customModel"

      # ============================================================
      # 13. VERIFY MODEL CONFIGURATION
      # ============================================================

      - name: Verify Model Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING MODEL"
          Write-Host "=============================================="

          $body = @{
              model = $env:OLLAMA_ACTIVE_MODEL
          } | ConvertTo-Json

          $info = Invoke-RestMethod `
            -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/show" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

          Write-Host "Model: $env:OLLAMA_ACTIVE_MODEL"

          if ($info.parameters) {
              Write-Host ""
              Write-Host "Parameters:"
              Write-Host $info.parameters
          }

          Write-Host ""
          Write-Host "Ollama process status:"
          & $env:OLLAMA_EXE ps

      # ============================================================
      # 14. PRELOAD MODEL
      # ============================================================

      - name: Preload Model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " PRELOADING MODEL"
          Write-Host "=============================================="

          $body = @{
              model = $env:OLLAMA_ACTIVE_MODEL
              keep_alive = -1
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/generate" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body `
            -ErrorAction Stop |
            Out-Null

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Loaded model:"
          & $env:OLLAMA_EXE ps

      # ============================================================
      # 15. TEST 64K API CONFIGURATION
      # ============================================================

      - name: Test Ollama API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TESTING OLLAMA API"
          Write-Host "=============================================="

          $body = @{
              model = $env:OLLAMA_ACTIVE_MODEL
              prompt = "Reply with exactly: OLLAMA_OK"
              stream = $false
              keep_alive = -1
              options = @{
                  num_ctx = 65536
                  num_predict = 16
                  temperature = 0
              }
          } | ConvertTo-Json -Depth 10

          $result = Invoke-RestMethod `
            -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/generate" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body `
            -ErrorAction Stop

          Write-Host "Response:"
          Write-Host $result.response

          if ([string]::IsNullOrWhiteSpace($result.response)) {
              throw "Ollama returned an empty response."
          }

          Write-Host ""
          Write-Host "Ollama API test PASSED."

      # ============================================================
      # 16. VERIFY RDP
      # ============================================================

      - name: Verify RDP Port
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING RDP"
          Write-Host "=============================================="

          $listener = Get-NetTCPConnection `
            -LocalPort $env:RDP_PORT `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP is not listening on port $env:RDP_PORT."
          }

          $listener |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host "RDP listener detected."

      # ============================================================
      # 17. CREATE DESKTOP API GUIDE
      # ============================================================

      - name: Create API Guide
        shell: pwsh
        run: |
          $guidePath = Join-Path `
            $env:USERPROFILE `
            "Desktop\ollama_api_guide.txt"

          $guide = @"
OLLAMA REMOTE API
=================

Tailscale IP:
$env:TAILSCALE_IP

Ollama URL:
$env:OLLAMA_URL

OpenAI-compatible base URL:
$env:OLLAMA_URL/v1

Active model:
$env:OLLAMA_ACTIVE_MODEL

Context:
65536

KV cache:
q8_0

Flash Attention:
enabled

Parallel requests:
1


OPENAI-COMPATIBLE EXAMPLE
=========================

Base URL:
$env:OLLAMA_URL/v1

API key:
ollama

Model:
$env:OLLAMA_ACTIVE_MODEL


PYTHON
======

from openai import OpenAI

client = OpenAI(
    base_url="$env:OLLAMA_URL/v1/",
    api_key="ollama"
)

response = client.chat.completions.create(
    model="$env:OLLAMA_ACTIVE_MODEL",
    messages=[
        {
            "role": "user",
            "content": "Hello"
        }
    ],
    max_tokens=4096,
    temperature=0.7
)

print(response.choices[0].message.content)


NATIVE OLLAMA API
=================

POST:
$env:OLLAMA_URL/api/generate

Example:

{
  "model": "$env:OLLAMA_ACTIVE_MODEL",
  "prompt": "Hello",
  "stream": false,
  "keep_alive": -1,
  "options": {
    "num_ctx": 65536,
    "num_predict": 4096,
    "temperature": 0.7
  }
}


IMPORTANT
=========

The server default context is 65536.

For individual requests you can specify:

options.num_ctx = 65536

For long generation:

options.num_predict = -1

For OpenAI-compatible requests:

max_tokens controls generation length.

Do not confuse max_tokens with num_ctx.

Base URL for OpenAI-compatible clients:

$env:OLLAMA_URL/v1

NOT:

$env:OLLAMA_URL/v1/chat/completions
"@

          $guide |
            Set-Content `
              -Path $guidePath `
              -Encoding UTF8

          Write-Host "API guide created:"
          Write-Host $guidePath

      # ============================================================
      # 18. CONNECTION INFORMATION
      # ============================================================

      - name: Display Connection Information
        shell: pwsh
        run: |
          $timeout = [int]"${{ github.event.inputs.session_timeout_minutes }}"
          $endTime = (Get-Date).AddMinutes($timeout)

          Write-Host ""
          Write-Host "=============================================================="
          Write-Host "                 RDP + OLLAMA READY"
          Write-Host "=============================================================="
          Write-Host ""
          Write-Host "RDP"
          Write-Host "--------------------------------------------------------------"
          Write-Host "Host:       $env:TAILSCALE_IP"
          Write-Host "Port:       $env:RDP_PORT"
          Write-Host "Username:   $env:RDP_USERNAME"
          Write-Host "Password:   $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Use Windows Remote Desktop:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "=============================================================="
          Write-Host ""
          Write-Host "OLLAMA"
          Write-Host "--------------------------------------------------------------"
          Write-Host "API:        $env:OLLAMA_URL"
          Write-Host "OpenAI:     $env:OLLAMA_URL/v1"
          Write-Host "Model:      $env:OLLAMA_ACTIVE_MODEL"
          Write-Host "Context:    65536"
          Write-Host "KV cache:   q8_0"
          Write-Host "Flash:      enabled"
          Write-Host "Parallel:   1"
          Write-Host ""
          Write-Host "=============================================================="
          Write-Host ""
          Write-Host "SESSION"
          Write-Host "--------------------------------------------------------------"
          Write-Host "Ends:       $endTime"
          Write-Host "=============================================================="
          Write-Host ""

          # GitHub step summary.
          @"
          ## 🖥️ RDP + Ollama Ready

          | Setting | Value |
          |---|---|
          | RDP Host | `$env:TAILSCALE_IP` |
          | RDP Port | `$env:RDP_PORT` |
          | RDP User | `$env:RDP_USERNAME` |
          | Ollama API | `$env:OLLAMA_URL` |
          | OpenAI Base URL | `$env:OLLAMA_URL/v1` |
          | Model | `$env:OLLAMA_ACTIVE_MODEL` |
          | Context | `65536` |
          | KV Cache | `q8_0` |
          | Flash Attention | Enabled |
          | Parallel | `1` |
          | Session Ends | `$endTime` |

          ### RDP

          Connect to:

          `$env:TAILSCALE_IP`

          Username:

          `$env:RDP_USERNAME`

          Password:

          `$env:RDP_PASSWORD`

          ### Ollama

          OpenAI-compatible base URL:

          `$env:OLLAMA_URL/v1`

          API key:

          `ollama`

          Model:

          `$env:OLLAMA_ACTIVE_MODEL`

          **Keep this workflow running while you use the machine.**
          "@ |
            Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY `
              -Encoding UTF8 `
              -Append

      # ============================================================
      # 19. KEEP SESSION ALIVE
      # ============================================================

      - name: Keep Session Alive
        shell: pwsh
        timeout-minutes: 360
        run: |
          $ErrorActionPreference = "Continue"

          $timeout = [int]"${{ github.event.inputs.session_timeout_minutes }}"
          $endTime = (Get-Date).AddMinutes($timeout)

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " SESSION ACTIVE"
          Write-Host "=============================================="
          Write-Host "End time: $endTime"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $remaining = $endTime - (Get-Date)

              Write-Host (
                "[{0}] Active | Remaining: {1:hh\:mm\:ss}" -f `
                (Get-Date -Format "yyyy-MM-dd HH:mm:ss"),
                $remaining
              )

              # ------------------------------------------------------
              # Check Ollama
              # ------------------------------------------------------

              $ollamaProcess = Get-Process `
                -Name "ollama" `
                -ErrorAction SilentlyContinue

              if ($ollamaProcess) {

                  $memoryMB = [math]::Round(
                    $ollamaProcess.WorkingSet64 / 1MB,
                    0
                  )

                  Write-Host "Ollama: RUNNING | Process memory: $memoryMB MB"

              } else {

                  Write-Host "WARNING: Ollama process not detected."

              }

              # ------------------------------------------------------
              # Check API
              # ------------------------------------------------------

              try {

                  $null = Invoke-RestMethod `
                    -Uri "http://127.0.0.1:$env:OLLAMA_PORT/api/tags" `
                    -Method Get `
                    -TimeoutSec 5

                  Write-Host "Ollama API: OK"

              } catch {

                  Write-Host "WARNING: Ollama API unavailable."
              }

              # ------------------------------------------------------
              # Check RDP
              # ------------------------------------------------------

              $rdp = Get-NetTCPConnection `
                -LocalPort $env:RDP_PORT `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "RDP: LISTENING"
              } else {
                  Write-Host "WARNING: RDP listener unavailable."
              }

              # ------------------------------------------------------
              # Model status
              # ------------------------------------------------------

              Write-Host ""
              Write-Host "Model status:"
              & $env:OLLAMA_EXE ps 2>$null

              Write-Host ""

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Session timeout reached."

      # ============================================================
      # 20. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CLEANUP"
          Write-Host "=============================================="

          # Stop model.
          try {

              if ($env:OLLAMA_EXE -and
                  (Test-Path $env:OLLAMA_EXE) -and
                  $env:OLLAMA_ACTIVE_MODEL) {

                  Write-Host "Stopping Ollama model..."

                  & $env:OLLAMA_EXE stop `
                    $env:OLLAMA_ACTIVE_MODEL `
                    2>$null
              }

          } catch {
              Write-Host "Ollama model cleanup warning: $_"
          }

          # Stop Ollama server.
          try {

              Get-Process `
                -Name "ollama" `
                -ErrorAction SilentlyContinue |
                Stop-Process `
                  -Force `
                  -ErrorAction SilentlyContinue

              Write-Host "Ollama server stopped."

          } catch {
              Write-Host "Ollama process cleanup warning: $_"
          }

          # Remove firewall rules.
          try {

              Remove-NetFirewallRule `
                -DisplayName $env:RDP_FIREWALL_RULE `
                -ErrorAction SilentlyContinue

              Remove-NetFirewallRule `
                -DisplayName $env:OLLAMA_FIREWALL_RULE `
                -ErrorAction SilentlyContinue

              Write-Host "Firewall rules removed."

          } catch {
              Write-Host "Firewall cleanup warning: $_"
          }

          # Disconnect Tailscale.
          try {

              $tailscale = Get-Command `
                tailscale.exe `
                -ErrorAction SilentlyContinue

              if ($tailscale) {

                  Write-Host "Disconnecting Tailscale..."

                  & $tailscale.Source down 2>$null

              }

          } catch {
              Write-Host "Tailscale cleanup warning: $_"
          }

          Write-Host ""
          Write-Host "Cleanup completed."
