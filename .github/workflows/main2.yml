name: Secure RDP with Distributed llama.cpp
run-name: Distributed llama.cpp RDP - ${{ github.actor }} - ${{ github.run_id }}

on:
workflow_dispatch:
inputs:
model:
description: 'Hugging Face llama.cpp model (repo:quant)'
required: false
default: 'mradermacher/Qwen3.5-27B-Uncensored-GGUF:Q4_K_M'
type: string

  context:
    description: 'Context size'
    required: false
    default: '65536'
    type: string

  session_timeout_minutes:
    description: 'Session timeout in minutes (5-360)'
    required: false
    default: '360'
    type: string

jobs:

================================================================

================================================================

RPC WORKER

This is the SECOND RDP machine.

It exposes its CPU/RAM as a remote ggml device.

llama-server on the main machine will send part of the

model to this machine.

================================================================

================================================================

rpc-worker:
runs-on: windows-latest
timeout-minutes: 370

env:
  RDP_USERNAME: 'RDP'

  RDP_PORT: '3389'
  RPC_PORT: '50052'

  TAILSCALE_HOSTNAME: 'llama-rpc-${{ github.run_id }}'

  RDP_FIREWALL_RULE: 'RDP-Tailscale'
  RPC_FIREWALL_RULE: 'llama.cpp-RPC-Tailscale'

  REMOTE_DESKTOP_SERVICE: 'TermService'

steps:

  # ------------------------------------------------------------
  # SYSTEM INFORMATION
  # ------------------------------------------------------------

  - name: Show Worker Hardware
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "=============================================="
      Write-Host " RPC WORKER HARDWARE"
      Write-Host "=============================================="

      Get-CimInstance Win32_ComputerSystem |
        Select-Object NumberOfLogicalProcessors,
                      TotalPhysicalMemory |
        Format-List

      Write-Host "CPU threads: $env:NUMBER_OF_PROCESSORS"

      $os = Get-CimInstance Win32_OperatingSystem

      $totalGB =
        [math]::Round(
          $os.TotalVisibleMemorySize / 1MB,
          2
        )

      $freeGB =
        [math]::Round(
          $os.FreePhysicalMemory / 1MB,
          2
        )

      Write-Host "Total RAM: $totalGB GB"
      Write-Host "Free RAM:  $freeGB GB"

  # ------------------------------------------------------------
  # RDP
  # ------------------------------------------------------------

  - name: Configure RDP
    shell: pwsh
    run: |
      try {

        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name 'fDenyTSConnections' `
          -Value 0 `
          -Force

        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop" `
          -ErrorAction SilentlyContinue

        Restart-Service `
          -Name $env:REMOTE_DESKTOP_SERVICE `
          -Force

        Write-Host "✓ RDP enabled"

      } catch {
        Write-Error "RDP configuration failed: $_"
        exit 1
      }

  # ------------------------------------------------------------
  # RDP USER
  # ------------------------------------------------------------

  - name: Create RDP User
    shell: pwsh
    run: |
      try {

        $upper = [char[]](65..90)
        $lower = [char[]](97..122)
        $numbers = [char[]](48..57)

        $special = @(
          '!',
          '@',
          '#',
          '$',
          '%',
          '^',
          '&',
          '*'
        )

        $chars = @()

        $chars += ($upper | Get-Random -Count 4)
        $chars += ($lower | Get-Random -Count 4)
        $chars += ($numbers | Get-Random -Count 4)
        $chars += ($special | Get-Random -Count 4)

        $password =
          -join ($chars | Get-Random -Count 16)

        $securePassword =
          ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

        $existing =
          Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

        if ($existing) {

          Set-LocalUser `
            -Name $env:RDP_USERNAME `
            -Password $securePassword

        } else {

          New-LocalUser `
            -Name $env:RDP_USERNAME `
            -Password $securePassword `
            -AccountNeverExpires `
            -ErrorAction Stop |
            Out-Null

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME
        }

        "RDP_WORKER_PASS=$password" |
          Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding UTF8

        Write-Host "✓ RPC worker RDP user ready"

      } catch {
        Write-Error "RDP user creation failed: $_"
        exit 1
      }

  # ------------------------------------------------------------
  # TAILSCALE
  # ------------------------------------------------------------

  - name: Install Tailscale
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $installer =
        "$env:TEMP\tailscale.msi"

      $ProgressPreference = "SilentlyContinue"

      Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
        -OutFile $installer

      $p = Start-Process `
        msiexec.exe `
        -ArgumentList "/i `"$installer`" /quiet /norestart" `
        -Wait `
        -PassThru

      if ($p.ExitCode -ne 0) {
        throw "Tailscale installation failed: $($p.ExitCode)"
      }

      Start-Sleep 5

      Write-Host "✓ Tailscale installed"

  - name: Connect Tailscale Worker
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $tailscale =
        "$env:ProgramFiles\Tailscale\tailscale.exe"

      & $tailscale up `
        --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
        --hostname="$env:TAILSCALE_HOSTNAME" `
        --accept-dns=true

      if ($LASTEXITCODE -ne 0) {
        throw "Tailscale connection failed"
      }

      $ip = $null

      for ($i = 1; $i -le 30; $i++) {

        $ip =
          (& $tailscale ip -4 2>$null).Trim()

        if ($ip) {
          break
        }

        Start-Sleep 2
      }

      if (-not $ip) {
        throw "No Tailscale IPv4 address"
      }

      "RPC_TAILSCALE_IP=$ip" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host ""
      Write-Host "=============================================="
      Write-Host " RPC WORKER TAILSCALE"
      Write-Host "=============================================="
      Write-Host "Hostname: $env:TAILSCALE_HOSTNAME"
      Write-Host "IP:       $ip"
      Write-Host "RPC:      $ip`:$env:RPC_PORT"
      Write-Host "=============================================="

  # ------------------------------------------------------------
  # FIREWALL
  # Only allow RPC from the Tailscale address space.
  # ------------------------------------------------------------

  - name: Configure Tailscale Firewall
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      netsh advfirewall firewall delete rule `
        name="$env:RPC_FIREWALL_RULE" `
        2>$null

      netsh advfirewall firewall delete rule `
        name="$env:RDP_FIREWALL_RULE" `
        2>$null

      netsh advfirewall firewall add rule `
        name="$env:RPC_FIREWALL_RULE" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=$env:RPC_PORT `
        remoteip=100.64.0.0/10 `
        profile=any

      netsh advfirewall firewall add rule `
        name="$env:RDP_FIREWALL_RULE" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=$env:RDP_PORT `
        remoteip=100.64.0.0/10 `
        profile=any

      Write-Host "✓ RPC restricted to Tailscale"
      Write-Host "✓ RDP restricted to Tailscale"

  # ------------------------------------------------------------
  # LLAMA.CPP
  # Dynamically download the latest official Windows AVX2 build.
  # ------------------------------------------------------------

  - name: Download Latest llama.cpp
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $api =
        "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"

      Write-Host "Checking latest llama.cpp release..."

      $release =
        Invoke-RestMethod `
          -Uri $api `
          -Headers @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "github-actions"
          }

      Write-Host "Latest release: $($release.tag_name)"

      $asset =
        $release.assets |
        Where-Object {
          $_.name -match "win-avx2-x64\.zip$"
        } |
        Select-Object -First 1

      if (-not $asset) {
        throw "Could not find official Windows AVX2 x64 llama.cpp release asset."
      }

      Write-Host "Asset: $($asset.name)"
      Write-Host "URL:   $($asset.browser_download_url)"

      $zip =
        "$env:TEMP\llama.cpp.zip"

      Invoke-WebRequest `
        -Uri $asset.browser_download_url `
        -OutFile $zip `
        -Headers @{
          "User-Agent" = "github-actions"
        }

      $dir =
        "$env:RUNNER_TEMP\llama"

      New-Item `
        -ItemType Directory `
        -Force `
        -Path $dir |
        Out-Null

      Expand-Archive `
        -Path $zip `
        -DestinationPath $dir `
        -Force

      $rpc =
        Get-ChildItem `
          -Path $dir `
          -Filter "ggml-rpc-server.exe" `
          -Recurse `
          -ErrorAction SilentlyContinue |
        Select-Object -First 1

      if (-not $rpc) {

        $rpc =
          Get-ChildItem `
            -Path $dir `
            -Filter "rpc-server.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
          Select-Object -First 1
      }

      if (-not $rpc) {
        throw "RPC server executable was not found."
      }

      "LLAMA_DIR=$($rpc.Directory.FullName)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      "RPC_EXE=$($rpc.FullName)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host "✓ llama.cpp downloaded"
      Write-Host "✓ RPC executable: $($rpc.FullName)"

  # ------------------------------------------------------------
  # START RPC SERVER
  # ------------------------------------------------------------

  - name: Start llama.cpp RPC Worker
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      if (-not (Test-Path $env:RPC_EXE)) {
        throw "RPC executable missing"
      }

      $os =
        Get-CimInstance Win32_OperatingSystem

      $totalMB =
        [math]::Floor(
          $os.TotalVisibleMemorySize / 1024
        )

      # Keep ~2 GB for Windows and RDP.
      $rpcMemory =
        [math]::Max(
          4096,
          $totalMB - 2048
        )

      $threads =
        [int]$env:NUMBER_OF_PROCESSORS

      if ($threads -lt 1) {
        $threads = 2
      }

      Write-Host ""
      Write-Host "=============================================="
      Write-Host " STARTING DISTRIBUTED RPC WORKER"
      Write-Host "=============================================="
      Write-Host "RPC host:     0.0.0.0"
      Write-Host "RPC port:     $env:RPC_PORT"
      Write-Host "RPC memory:   $rpcMemory MB"
      Write-Host "CPU threads:  $threads"
      Write-Host "=============================================="

      $args = @(
        "--host", "0.0.0.0",
        "--port", "$env:RPC_PORT",
        "--mem", "$rpcMemory",
        "--threads", "$threads",
        "--cache"
      )

      $process =
        Start-Process `
          -FilePath $env:RPC_EXE `
          -ArgumentList $args `
          -WorkingDirectory $env:LLAMA_DIR `
          -WindowStyle Hidden `
          -PassThru

      "RPC_PID=$($process.Id)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Start-Sleep 10

      if ($process.HasExited) {
        throw "RPC server exited immediately with code $($process.ExitCode)"
      }

      Write-Host "✓ RPC server running"
      Write-Host "PID: $($process.Id)"

  # ------------------------------------------------------------
  # VERIFY RPC
  # ------------------------------------------------------------

  - name: Verify RPC Worker
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $ok = $false

      for ($i = 1; $i -le 30; $i++) {

        try {

          $test =
            Test-NetConnection `
              -ComputerName $env:RPC_TAILSCALE_IP `
              -Port $env:RPC_PORT `
              -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
            $ok = $true
            break
          }

        } catch {}

        Write-Host "Waiting for RPC..."
        Start-Sleep 2
      }

      if (-not $ok) {
        throw "RPC port did not become reachable"
      }

      Write-Host "✓ RPC server reachable"

  # ------------------------------------------------------------
  # WORKER SESSION
  # ------------------------------------------------------------

  - name: Worker Connection Information
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "╔════════════════════════════════════════════════════╗"
      Write-Host "║             RPC WORKER / RDP #2                  ║"
      Write-Host "╠════════════════════════════════════════════════════╣"
      Write-Host "║ Host:        $env:RPC_TAILSCALE_IP"
      Write-Host "║ RDP Port:    $env:RDP_PORT"
      Write-Host "║ Username:    $env:RDP_USERNAME"
      Write-Host "║ Password:    $env:RDP_WORKER_PASS"
      Write-Host "║"
      Write-Host "║ RPC endpoint:"
      Write-Host "║ $env:RPC_TAILSCALE_IP`:$env:RPC_PORT"
      Write-Host "╚════════════════════════════════════════════════════╝"

  - name: Keep RPC Worker Alive
    shell: pwsh
    run: |
      $timeout =
        [int]"${{ github.event.inputs.session_timeout_minutes }}"

      $end =
        (Get-Date).AddMinutes($timeout + 2)

      while ((Get-Date) -lt $end) {

        $rpc =
          Get-Process `
            -Id $env:RPC_PID `
            -ErrorAction SilentlyContinue

        if (-not $rpc) {
          Write-Host "WARNING: RPC server stopped."
        }

        Write-Host (
          "[{0}] RPC worker active | RAM {1:N1} GB" -f `
          (Get-Date -Format "HH:mm:ss"),
          (
            (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory /
            1MB
          )
        )

        Start-Sleep 60
      }

  - name: RPC Worker Cleanup
    if: always()
    shell: pwsh
    run: |
      try {

        if ($env:RPC_PID) {

          Stop-Process `
            -Id $env:RPC_PID `
            -Force `
            -ErrorAction SilentlyContinue
        }

      } catch {}

      try {

        & "$env:ProgramFiles\Tailscale\tailscale.exe" down `
          2>$null

      } catch {}

      try {

        netsh advfirewall firewall delete rule `
          name="$env:RPC_FIREWALL_RULE" `
          2>$null

        netsh advfirewall firewall delete rule `
          name="$env:RDP_FIREWALL_RULE" `
          2>$null

      } catch {}

================================================================

================================================================

MAIN LLAMA SERVER

This is the FIRST RDP machine.

================================================================

================================================================

llama-host:
runs-on: windows-latest
timeout-minutes: 370

env:
  RDP_USERNAME: 'RDP'

  RDP_PORT: '3389'
  LLAMA_PORT: '8080'

  RPC_PORT: '50052'

  TAILSCALE_HOSTNAME: 'llama-main-${{ github.run_id }}'
  RPC_HOSTNAME: 'llama-rpc-${{ github.run_id }}'

  RDP_FIREWALL_RULE: 'RDP-Tailscale'
  LLAMA_FIREWALL_RULE: 'llama.cpp-API-Tailscale'

  REMOTE_DESKTOP_SERVICE: 'TermService'

steps:

  # ------------------------------------------------------------
  # SYSTEM INFORMATION
  # ------------------------------------------------------------

  - name: Show Main Hardware
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "=============================================="
      Write-Host " MAIN LLAMA HOST HARDWARE"
      Write-Host "=============================================="

      Get-CimInstance Win32_ComputerSystem |
        Select-Object NumberOfLogicalProcessors,
                      TotalPhysicalMemory |
        Format-List

      $os =
        Get-CimInstance Win32_OperatingSystem

      Write-Host (
        "RAM: {0:N2} GB" -f
        ($os.TotalVisibleMemorySize / 1MB)
      )

      Write-Host "CPU threads: $env:NUMBER_OF_PROCESSORS"

  # ------------------------------------------------------------
  # INPUT VALIDATION
  # ------------------------------------------------------------

  - name: Validate Configuration
    shell: pwsh
    run: |
      $context =
        [int]"${{ github.event.inputs.context }}"

      if ($context -lt 4096 -or $context -gt 131072) {
        throw "Context must be between 4096 and 131072."
      }

      $timeout =
        [int]"${{ github.event.inputs.session_timeout_minutes }}"

      if ($timeout -lt 5 -or $timeout -gt 360) {
        throw "Timeout must be between 5 and 360 minutes."
      }

      $model =
        "${{ github.event.inputs.model }}"

      if ([string]::IsNullOrWhiteSpace($model)) {
        $model =
          "mradermacher/Qwen3.5-27B-Uncensored-GGUF:Q4_K_M"
      }

      "LLAMA_MODEL=$model" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      "LLAMA_CONTEXT=$context" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host ""
      Write-Host "Model:   $model"
      Write-Host "Context: $context"

  # ------------------------------------------------------------
  # RDP
  # ------------------------------------------------------------

  - name: Configure RDP
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Set-ItemProperty `
        -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
        -Name 'fDenyTSConnections' `
        -Value 0 `
        -Force

      Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop" `
        -ErrorAction SilentlyContinue

      Restart-Service `
        -Name $env:REMOTE_DESKTOP_SERVICE `
        -Force

      Write-Host "✓ RDP enabled"

  # ------------------------------------------------------------
  # RDP USER
  # ------------------------------------------------------------

  - name: Create RDP User
    shell: pwsh
    run: |
      $upper = [char[]](65..90)
      $lower = [char[]](97..122)
      $numbers = [char[]](48..57)

      $special = @(
        '!',
        '@',
        '#',
        '$',
        '%',
        '^',
        '&',
        '*'
      )

      $chars = @()

      $chars += ($upper | Get-Random -Count 4)
      $chars += ($lower | Get-Random -Count 4)
      $chars += ($numbers | Get-Random -Count 4)
      $chars += ($special | Get-Random -Count 4)

      $password =
        -join ($chars | Get-Random -Count 16)

      $securePassword =
        ConvertTo-SecureString `
          $password `
          -AsPlainText `
          -Force

      $existing =
        Get-LocalUser `
          -Name $env:RDP_USERNAME `
          -ErrorAction SilentlyContinue

      if ($existing) {

        Set-LocalUser `
          -Name $env:RDP_USERNAME `
          -Password $securePassword

      } else {

        New-LocalUser `
          -Name $env:RDP_USERNAME `
          -Password $securePassword `
          -AccountNeverExpires |
          Out-Null

        Add-LocalGroupMember `
          -Group "Administrators" `
          -Member $env:RDP_USERNAME

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member $env:RDP_USERNAME
      }

      "RDP_MAIN_PASS=$password" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host "✓ Main RDP user ready"

  # ------------------------------------------------------------
  # TAILSCALE
  # ------------------------------------------------------------

  - name: Install Tailscale
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $installer =
        "$env:TEMP\tailscale.msi"

      $ProgressPreference = "SilentlyContinue"

      Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
        -OutFile $installer

      $p =
        Start-Process `
          msiexec.exe `
          -ArgumentList "/i `"$installer`" /quiet /norestart" `
          -Wait `
          -PassThru

      if ($p.ExitCode -ne 0) {
        throw "Tailscale installation failed"
      }

      Start-Sleep 5

  - name: Connect Tailscale Main
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $tailscale =
        "$env:ProgramFiles\Tailscale\tailscale.exe"

      & $tailscale up `
        --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
        --hostname="$env:TAILSCALE_HOSTNAME" `
        --accept-dns=true

      if ($LASTEXITCODE -ne 0) {
        throw "Tailscale connection failed"
      }

      $ip = $null

      for ($i = 1; $i -le 30; $i++) {

        $ip =
          (& $tailscale ip -4 2>$null).Trim()

        if ($ip) {
          break
        }

        Start-Sleep 2
      }

      if (-not $ip) {
        throw "No Tailscale IP"
      }

      "MAIN_TAILSCALE_IP=$ip" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host "✓ Main Tailscale IP: $ip"

  # ------------------------------------------------------------
  # FIREWALL
  # ------------------------------------------------------------

  - name: Configure Tailscale Firewall
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      netsh advfirewall firewall delete rule `
        name="$env:RDP_FIREWALL_RULE" `
        2>$null

      netsh advfirewall firewall delete rule `
        name="$env:LLAMA_FIREWALL_RULE" `
        2>$null

      netsh advfirewall firewall add rule `
        name="$env:RDP_FIREWALL_RULE" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=$env:RDP_PORT `
        remoteip=100.64.0.0/10 `
        profile=any

      netsh advfirewall firewall add rule `
        name="$env:LLAMA_FIREWALL_RULE" `
        dir=in `
        action=allow `
        protocol=TCP `
        localport=$env:LLAMA_PORT `
        remoteip=100.64.0.0/10 `
        profile=any

      Write-Host "✓ RDP restricted to Tailscale"
      Write-Host "✓ llama.cpp API restricted to Tailscale"

  # ------------------------------------------------------------
  # LLAMA.CPP
  # ------------------------------------------------------------

  - name: Download Latest llama.cpp
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $release =
        Invoke-RestMethod `
          -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" `
          -Headers @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "github-actions"
          }

      Write-Host "Latest llama.cpp: $($release.tag_name)"

      $asset =
        $release.assets |
        Where-Object {
          $_.name -match "win-avx2-x64\.zip$"
        } |
        Select-Object -First 1

      if (-not $asset) {
        throw "Official Windows AVX2 build not found."
      }

      $zip =
        "$env:TEMP\llama.cpp.zip"

      Invoke-WebRequest `
        -Uri $asset.browser_download_url `
        -OutFile $zip `
        -Headers @{
          "User-Agent" = "github-actions"
        }

      $dir =
        "$env:RUNNER_TEMP\llama"

      New-Item `
        -ItemType Directory `
        -Force `
        -Path $dir |
        Out-Null

      Expand-Archive `
        -Path $zip `
        -DestinationPath $dir `
        -Force

      $server =
        Get-ChildItem `
          -Path $dir `
          -Filter "llama-server.exe" `
          -Recurse |
        Select-Object -First 1

      if (-not $server) {
        throw "llama-server.exe not found."
      }

      "LLAMA_EXE=$($server.FullName)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      "LLAMA_DIR=$($server.Directory.FullName)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host "✓ llama-server: $($server.FullName)"

  # ------------------------------------------------------------
  # FIND RPC WORKER
  # ------------------------------------------------------------

  - name: Discover RPC Worker
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host ""
      Write-Host "Searching for RPC worker:"
      Write-Host "$env:RPC_HOSTNAME"

      $rpcIP = $null

      # Tailscale DNS can take a little time to propagate.
      for ($i = 1; $i -le 60; $i++) {

        try {

          $result =
            Resolve-DnsName `
              -Name $env:RPC_HOSTNAME `
              -Type A `
              -ErrorAction Stop

          $rpcIP =
            $result |
            Where-Object {
              $_.IPAddress
            } |
            Select-Object -First 1 -ExpandProperty IPAddress

          if ($rpcIP) {
            break
          }

        } catch {}

        Write-Host "Waiting for RPC worker DNS... $i/60"

        Start-Sleep 5
      }

      if (-not $rpcIP) {

        Write-Host ""
        Write-Host "DNS did not resolve. Trying Tailscale status..."

        $tailscale =
          "$env:ProgramFiles\Tailscale\tailscale.exe"

        & $tailscale status

        throw "Could not discover RPC worker."
      }

      "RPC_IP=$rpcIP" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host ""
      Write-Host "✓ RPC worker IP: $rpcIP"

  # ------------------------------------------------------------
  # VERIFY RPC CONNECTION
  # ------------------------------------------------------------

  - name: Wait For RPC Worker
    shell: pwsh
    run: |
      $ok = $false

      for ($i = 1; $i -le 60; $i++) {

        try {

          $test =
            Test-NetConnection `
              -ComputerName $env:RPC_IP `
              -Port $env:RPC_PORT `
              -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
            $ok = $true
            break
          }

        } catch {}

        Write-Host "Waiting for RPC worker... $i/60"

        Start-Sleep 5
      }

      if (-not $ok) {
        throw "RPC worker is not reachable."
      }

      Write-Host "✓ RPC worker connected"
      Write-Host "✓ Endpoint: $env:RPC_IP`:$env:RPC_PORT"

  # ------------------------------------------------------------
  # START DISTRIBUTED LLAMA SERVER
  # ------------------------------------------------------------

  - name: Start Distributed llama.cpp
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      if (-not (Test-Path $env:LLAMA_EXE)) {
        throw "llama-server executable missing."
      }

      $threads =
        [int]$env:NUMBER_OF_PROCESSORS

      if ($threads -lt 1) {
        $threads = 2
      }

      Write-Host ""
      Write-Host "================================================"
      Write-Host " DISTRIBUTED LLAMA.CPP"
      Write-Host "================================================"
      Write-Host "Model:          $env:LLAMA_MODEL"
      Write-Host "Context:        $env:LLAMA_CONTEXT"
      Write-Host "RPC worker:     $env:RPC_IP`:$env:RPC_PORT"
      Write-Host "Threads:        $threads"
      Write-Host "Tensor split:   1,1"
      Write-Host "KV K:           q8_0"
      Write-Host "KV V:           q8_0"
      Write-Host "Flash attention: ON"
      Write-Host "API port:       $env:LLAMA_PORT"
      Write-Host "================================================"

      # llama.cpp downloads the GGUF directly from Hugging Face
      # using the -hf repo:quant syntax.
      #
      # RPC distributes the model between this host and the
      # second GitHub runner.
      #
      # 1,1 explicitly requests approximately equal splitting
      # between the two available devices.

      $arguments = @(
        "-hf", "$env:LLAMA_MODEL",
        "--host", "0.0.0.0",
        "--port", "$env:LLAMA_PORT",

        "--ctx-size", "$env:LLAMA_CONTEXT",

        "--n-gpu-layers", "999",

        "--rpc",
        "$env:RPC_IP`:$env:RPC_PORT",

        "--tensor-split",
        "1,1",

        "--threads",
        "$threads",

        "--threads-batch",
        "$threads",

        "--cache-type-k",
        "q8_0",

        "--cache-type-v",
        "q8_0",

        "--flash-attn",
        "on",

        "--parallel",
        "1",

        "--batch-size",
        "512",

        "--ubatch-size",
        "256",

        "--no-warmup"
      )

      Write-Host ""
      Write-Host "Launching:"
      Write-Host "$env:LLAMA_EXE $($arguments -join ' ')"
      Write-Host ""

      $process =
        Start-Process `
          -FilePath $env:LLAMA_EXE `
          -ArgumentList $arguments `
          -WorkingDirectory $env:LLAMA_DIR `
          -RedirectStandardOutput "$env:RUNNER_TEMP\llama-server.log" `
          -RedirectStandardError "$env:RUNNER_TEMP\llama-server-error.log" `
          -WindowStyle Hidden `
          -PassThru

      "LLAMA_PID=$($process.Id)" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding UTF8

      Write-Host "llama-server PID: $($process.Id)"

      # Wait for API.
      $ready = $false

      for ($i = 1; $i -le 180; $i++) {

        if ($process.HasExited) {

          Write-Host ""
          Write-Host "llama-server exited."
          Write-Host ""
          Write-Host "STDERR:"
          Get-Content `
            "$env:RUNNER_TEMP\llama-server-error.log" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "STDOUT:"
          Get-Content `
            "$env:RUNNER_TEMP\llama-server.log" `
            -ErrorAction SilentlyContinue

          throw "llama-server exited during startup."
        }

        try {

          $response =
            Invoke-WebRequest `
              -Uri "http://127.0.0.1:$env:LLAMA_PORT/health" `
              -UseBasicParsing `
              -TimeoutSec 5 `
              -ErrorAction Stop

          if ($response.StatusCode -eq 200) {

            $ready = $true
            break
          }

        } catch {}

        if (($i % 10) -eq 0) {
          Write-Host "Waiting for llama.cpp API... $i/180"
        }

        Start-Sleep 2
      }

      if (-not $ready) {

        Write-Host ""
        Write-Host "===== LLAMA SERVER ERROR ====="

        Get-Content `
          "$env:RUNNER_TEMP\llama-server-error.log" `
          -ErrorAction SilentlyContinue

        Write-Host ""
        Write-Host "===== LLAMA SERVER OUTPUT ====="

        Get-Content `
          "$env:RUNNER_TEMP\llama-server.log" `
          -ErrorAction SilentlyContinue

        throw "llama.cpp API did not become ready."
      }

      Write-Host ""
      Write-Host "✓ DISTRIBUTED LLAMA.CPP IS READY"

  # ------------------------------------------------------------
  # TEST API
  # ------------------------------------------------------------

  - name: Test llama.cpp API
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "Testing OpenAI-compatible endpoint..."

      $body = @{
        model = $env:LLAMA_MODEL
        messages = @(
          @{
            role = "user"
            content = "Reply with exactly: distributed llama cpp online"
          }
        )
        max_tokens = 20
        temperature = 0.1
      } | ConvertTo-Json -Depth 10

      try {

        $response =
          Invoke-RestMethod `
            -Uri "http://127.0.0.1:$env:LLAMA_PORT/v1/chat/completions" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body `
            -TimeoutSec 300

        Write-Host ""
        Write-Host "MODEL RESPONSE:"
        Write-Host $response.choices[0].message.content

        Write-Host ""
        Write-Host "✓ API TEST PASSED"

      } catch {

        Write-Host ""
        Write-Host "===== SERVER ERROR ====="

        Get-Content `
          "$env:RUNNER_TEMP\llama-server-error.log" `
          -ErrorAction SilentlyContinue

        throw "API test failed: $_"
      }

  # ------------------------------------------------------------
  # VERIFY REMOTE API
  # ------------------------------------------------------------

  - name: Verify Remote llama.cpp API
    shell: pwsh
    run: |
      $test =
        Test-NetConnection `
          -ComputerName $env:MAIN_TAILSCALE_IP `
          -Port $env:LLAMA_PORT `
          -WarningAction SilentlyContinue

      if (-not $test.TcpTestSucceeded) {
        throw "Remote llama.cpp port unavailable."
      }

      Write-Host "✓ llama.cpp API reachable over Tailscale"

  # ------------------------------------------------------------
  # CONNECTION INFORMATION
  # ------------------------------------------------------------

  - name: Display Connection Information
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "╔══════════════════════════════════════════════════════════╗"
      Write-Host "║       DISTRIBUTED LLAMA.CPP RDP SESSION                 ║"
      Write-Host "╠══════════════════════════════════════════════════════════╣"
      Write-Host "║"
      Write-Host "║ RDP #1 MAIN"
      Write-Host "║ Host:        $env:MAIN_TAILSCALE_IP"
      Write-Host "║ Port:        $env:RDP_PORT"
      Write-Host "║ Username:    $env:RDP_USERNAME"
      Write-Host "║ Password:    $env:RDP_MAIN_PASS"
      Write-Host "║"
      Write-Host "║ RDP #2 RPC WORKER"
      Write-Host "║ Hostname:    $env:RPC_HOSTNAME"
      Write-Host "║ Port:        $env:RDP_PORT"
      Write-Host "║"
      Write-Host "║ LLAMA.CPP"
      Write-Host "║ API:         http://$env:MAIN_TAILSCALE_IP`:$env:LLAMA_PORT"
      Write-Host "║ OpenAI API:  http://$env:MAIN_TAILSCALE_IP`:$env:LLAMA_PORT/v1"
      Write-Host "║"
      Write-Host "║ Model:       $env:LLAMA_MODEL"
      Write-Host "║ Context:     $env:LLAMA_CONTEXT"
      Write-Host "║"
      Write-Host "║ Distributed: YES"
      Write-Host "║ RPC:         $env:RPC_IP`:$env:RPC_PORT"
      Write-Host "║ Split:       1 : 1"
      Write-Host "║ KV K:        Q8_0"
      Write-Host "║ KV V:        Q8_0"
      Write-Host "║ Flash Attn:  ON"
      Write-Host "╚══════════════════════════════════════════════════════════╝"
      Write-Host ""

      Write-Host "IMPORTANT:"
      Write-Host "RDP #1 is the main llama.cpp host."
      Write-Host "RDP #2 is the remote RPC compute/RAM worker."
      Write-Host ""
      Write-Host "The two machines are NOT running two separate models."
      Write-Host "llama.cpp is distributing the model across them."

  # ------------------------------------------------------------
  # KEEP ALIVE
  # ------------------------------------------------------------

  - name: Keep Main Session Alive
    shell: pwsh
    run: |
      $timeout =
        [int]"${{ github.event.inputs.session_timeout_minutes }}"

      $end =
        (Get-Date).AddMinutes($timeout + 2)

      while ((Get-Date) -lt $end) {

        $remaining =
          $end - (Get-Date)

        $llama =
          Get-Process `
            -Id $env:LLAMA_PID `
            -ErrorAction SilentlyContinue

        if (-not $llama) {

          Write-Host "WARNING: llama-server stopped."

          if (Test-Path "$env:RUNNER_TEMP\llama-server-error.log") {

            Get-Content `
              "$env:RUNNER_TEMP\llama-server-error.log" `
              -Tail 40
          }
        }

        Write-Host (
          "[{0}] Distributed session active | Remaining: {1:hh\:mm\:ss}" -f `
          (Get-Date -Format "yyyy-MM-dd HH:mm:ss"),
          $remaining
        )

        if (($remaining.TotalSeconds % 300) -lt 60) {

          Write-Host ""
          Write-Host "RAM:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object `
              @{N="FreeGB";E={
                [math]::Round(
                  $_.FreePhysicalMemory / 1MB,
                  2
                )
              }} |
            Format-Table

          Write-Host ""
          Write-Host "llama.cpp process:"
          Get-Process `
            -Id $env:LLAMA_PID `
            -ErrorAction SilentlyContinue |
            Select-Object `
              Id,
              CPU,
              WorkingSet64 |
            Format-Table
        }

        Start-Sleep 60
      }

      Write-Host ""
      Write-Host "Session timeout reached."

  # ------------------------------------------------------------
  # LOGS
  # ------------------------------------------------------------

  - name: Show llama.cpp Logs
    if: always()
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "=============================================="
      Write-Host " LLAMA.CPP LOGS"
      Write-Host "=============================================="

      if (Test-Path "$env:RUNNER_TEMP\llama-server-error.log") {

        Get-Content `
          "$env:RUNNER_TEMP\llama-server-error.log" `
          -Tail 100
      }

  # ------------------------------------------------------------
  # CLEANUP
  # ------------------------------------------------------------

  - name: Main Cleanup
    if: always()
    shell: pwsh
    run: |
      Write-Host ""
      Write-Host "Cleaning up..."

      try {

        if ($env:LLAMA_PID) {

          Stop-Process `
            -Id $env:LLAMA_PID `
            -Force `
            -ErrorAction SilentlyContinue
        }

      } catch {}

      try {

        & "$env:ProgramFiles\Tailscale\tailscale.exe" down `
          2>$null

      } catch {}

      try {

        netsh advfirewall firewall delete rule `
          name="$env:RDP_FIREWALL_RULE" `
          2>$null

        netsh advfirewall firewall delete rule `
          name="$env:LLAMA_FIREWALL_RULE" `
          2>$null

      } catch {}

      Write-Host "✓ Main cleanup complete"
